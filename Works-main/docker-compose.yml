version: '3.8'

# ============================================
# VAKANS.UZ - Production Docker Compose
# ============================================
# IMPORTANT: Create a .env file with these variables:
# POSTGRES_USER=vakans_user
# POSTGRES_PASSWORD=your_secure_password
# POSTGRES_DB=vakans_db
# REDIS_PASSWORD=your_redis_password
# JWT_SECRET=your_64_char_jwt_secret
# JWT_REFRESH_SECRET=your_64_char_refresh_secret
# COOKIE_SECRET=your_cookie_secret
# CORS_ORIGIN=https://vakans.uz,https://www.vakans.uz
# ESKIZ_EMAIL=your_eskiz_email
# ESKIZ_PASSWORD=your_eskiz_password
# ============================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vakans_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vakans_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-vakans_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Port expose qilinmaydi - faqat internal Docker network
    networks:
      - vakans_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vakans_user} -d ${POSTGRES_DB:-vakans_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vakans_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    # Port expose qilinmaydi - faqat internal Docker network
    networks:
      - vakans_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vakans_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vakans_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vakans_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vakans.uz}
      # SMS Eskiz.uz
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      SMS_TEST_MODE: ${SMS_TEST_MODE:-false}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vakans_network

  # Frontend (Nginx serving static files)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vakans_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - vakans_network

volumes:
  postgres_data:
  redis_data:

networks:
  vakans_network:
    driver: bridge
