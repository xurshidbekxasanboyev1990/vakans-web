version: '3.8'

# ============================================
# VAKANS.UZ - PRODUCTION DOCKER COMPOSE
# ============================================
# Date: January 9, 2026
# Architecture: Isolated multi-site deployment
# Network: vakans_network (no overlap with other sites)
# ============================================

services:
  # PostgreSQL Database (Isolated)
  postgres:
    image: postgres:16-alpine
    container_name: vakans_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - vakans_postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    # SECURITY: Bind to 127.0.0.1 ONLY (not publicly accessible)
    # Using port 15432 to avoid conflict with other postgres instances
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - vakans_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache (Isolated)
  redis:
    image: redis:7-alpine
    container_name: vakans_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - vakans_redis_data:/data
    # SECURITY: Bind to 127.0.0.1 ONLY
    # Using port 16379 to avoid conflict with other redis instances
    ports:
      - "127.0.0.1:16379:6379"
    networks:
      - vakans_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (Node.js + Express + TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: vakans_backend:latest
    container_name: vakans_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # JWT Secrets
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      
      # Cookie
      COOKIE_SECRET: ${COOKIE_SECRET}
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN}
      
      # SMS (Eskiz.uz)
      ESKIZ_EMAIL: ${ESKIZ_EMAIL}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      SMS_TEST_MODE: ${SMS_TEST_MODE:-false}
      
      # Rate limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-5}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vakans_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Frontend (React + Vite → Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_DEMO_MODE: "false"
    image: vakans_frontend:latest
    container_name: vakans_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vakans_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes (persistent data)
volumes:
  vakans_postgres_data:
    driver: local
  vakans_redis_data:
    driver: local

# Isolated network (no overlap with sysmasters.uz)
networks:
  vakans_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
