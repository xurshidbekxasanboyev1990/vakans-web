version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: works_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: works_user
      POSTGRES_PASSWORD: works_secure_password_2024
      POSTGRES_DB: works_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    networks:
      - works_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U works_user -d works_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: works_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass works_redis_password_2024
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - works_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "works_redis_password_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: works_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://works_user:works_secure_password_2024@postgres:5432/works_db
      REDIS_URL: redis://:works_redis_password_2024@redis:6379
      JWT_SECRET: works_jwt_secret_key_2024_very_secure
      JWT_REFRESH_SECRET: works_jwt_refresh_secret_key_2024
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - works_network

  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: works_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - works_network

volumes:
  postgres_data:
  redis_data:

networks:
  works_network:
    driver: bridge
